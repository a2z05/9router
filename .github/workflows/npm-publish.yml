name: Publish CLI to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to publish"
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Publish CLI package to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # for npm provenance

    steps:
      - name: Check out release source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install root dependencies (includes Next.js)
        run: npm ci

      - name: Build and publish CLI
        working-directory: ./cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm run build
          npm publish --access public --provenance --registry https://registry.npmjs.org

      - name: Verify published version
        run: |
          sleep 10
          npm view 9router@latest version --registry https://registry.npmjs.org